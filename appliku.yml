build_settings:
  build_image: "dockerfile"
  container_port: 8888
  expose_web_port: true
  environment_variables:
    - name: HINDSIGHT_API_DATABASE_URL
      from_database:
        name: db
        property: private_connection_url
    - name: HINDSIGHT_API_HOST
      value: "0.0.0.0"
    - name: HINDSIGHT_API_PORT
      value: "8889"
    # Default LLM chain (retains, mental models): DeepSeek directly. Until 2026-10-10 this went
    # through the personal instance's Hermes consolidator-n8n gateway, which only forwarded to
    # DeepSeek and kept an 8 GB session store of every call. Consolidation has its own chain
    # (laptop primary, DeepSeek member 1) set entirely on the dashboard. API key = the DeepSeek
    # key, set as a dashboard secret (repo is public).
    # NOTE: values declared here are re-applied on every deploy and overwrite the dashboard, so a
    # routing change must be made HERE, not only in the dashboard (learned 2026-10-10 10:26 UTC).
    - name: HINDSIGHT_API_LLM_PROVIDER
      value: "openai"
    - name: HINDSIGHT_API_LLM_BASE_URL
      value: "https://api.deepseek.com/v1"
    - name: HINDSIGHT_API_LLM_MODEL
      value: "deepseek-chat"
    - name: HINDSIGHT_API_LLM_API_KEY
      source: manual
    # Consolidation workers — increase to process 68K backlog faster
    - name: HINDSIGHT_API_WORKER_CONSOLIDATION_MAX_SLOTS
      value: "6"
    - name: HINDSIGHT_API_CONSOLIDATION_MAX_MEMORIES_PER_ROUND
      value: "5000"
    - name: HINDSIGHT_API_CONSOLIDATION_BATCH_SIZE
      value: "100"
    # Embeddings: local in-container model (no external API)
    - name: HINDSIGHT_API_EMBEDDINGS_PROVIDER
      value: "local"
    - name: HINDSIGHT_API_RERANKER_PROVIDER
      value: "rrf"
    - name: HINDSIGHT_API_VECTOR_EXTENSION
      value: "pgvector"
    - name: HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS
      value: "4096"
    - name: HINDSIGHT_API_CONSOLIDATION_LLM_BATCH_SIZE
      value: "25"
    - name: HINDSIGHT_API_WORKER_ID
      value: "n8nhindsight-worker-1"
    - name: HINDSIGHT_API_MCP_ENABLED
      value: "true"
    # Restrict MCP to recall only — public read-only instance
    - name: HINDSIGHT_API_MCP_ENABLED_TOOLS
      value: "recall,list_banks,get_bank,get_bank_stats,list_tags"
    - name: HINDSIGHT_API_TENANT_EXTENSION
      value: "hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension"
    - name: HINDSIGHT_API_TENANT_API_KEY
      source: manual
    - name: HINDSIGHT_CP_DATAPLANE_API_URL
      value: "http://127.0.0.1:8889"
    - name: HINDSIGHT_CP_DATAPLANE_API_KEY
      value: "${HINDSIGHT_API_TENANT_API_KEY}"
    - name: HINDSIGHT_CP_ACCESS_KEY
      source: manual
    # GitHub sync cronjob
    - name: GITHUB_TOKEN
      source: manual
    - name: HINDSIGHT_URL
      value: "http://n8nhindsight_web:8888"
    - name: SYNC_STATE_FILE
      value: "/data/sync-state.json"
    # Admin key for the durable-log retrieval endpoint (GET /logs, ops-proxy).
    # Set the value in the Appliku dashboard (repo is public).
    - name: LOGS_ADMIN_KEY
      source: manual
    # Optional dedicated validator service URL. When set, ops-proxy forwards
    # POST /public/validate-workflow to that service instead of validating in-process.
    - name: WORKFLOW_VALIDATOR_FORWARD_URL
      source: manual

databases:
  db:
    type: postgresql_16_pgvector

services:
  web:
    # start.sh decodes *_B64 config values (Appliku escapes quotes in values) and then execs supervisord.
    command: "/usr/local/bin/start.sh"

cronjobs:
  github-sync:
    command: "python3 /app/scripts/sync-github.py"
    schedule: "0 3 * * *"
  docs-sync:
    command: "python3 /app/scripts/sync-docs.py"
    schedule: "30 3 * * *"
  community-sync:
    command: "python3 /app/scripts/sync-community.py"
    schedule: "0 4 * * *"
  releases-sync:
    command: "python3 /app/scripts/sync-releases.py"
    schedule: "30 4 * * *"

volumes:
  sync-data:
    target: "/data"
